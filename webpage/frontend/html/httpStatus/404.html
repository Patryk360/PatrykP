    <link href="/css/main.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/logo.png">
    <title>404 - Nie znaleziono</title>
    <style>
        .flex-grow-1 { flex: 1; }
        .error-code { font-size: calc(5rem + 5vw); font-weight: 900; line-height: 1; }
    </style>
</head>
<body class="bg-orange">
    <%- include('../partials/navbar.html', { token }); %>

                    <h1 class="error-code mb-0 text-black">404</h1>
                    <p class="h4 text-uppercase fw-bold mb-4">Chyba zabłądziłeś... <%- err.code %></p>
                    
                    <div class="position-relative d-inline-block">
                        <img src="/images/ham.gif" class="img-fluid border border-5 border-dark rounded-4 shadow-lg mb-5" 
                             alt="Błąd 404" style="max-height: 300px;">

                    <div>
                        <a href="/" class="btn btn-dark btn-lg px-5 py-3 rounded-pill fw-bold border-0 shadow" style="color: #ef7f1a !important;">

                </div>
            </div>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" style="margin-bottom: -1px;">
