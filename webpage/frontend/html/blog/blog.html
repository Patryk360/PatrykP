<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/main.css" rel="stylesheet">
    <link href="/css/blog.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/logo.png">
    <title><%= blog.title %></title>
</head>
<body>
    <%- include('../partials/navbar.html', { token }); %>
    
    <div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" style="margin-bottom: -1px;">
            <path fill="#000000" fill-opacity="1" d="M0,32L48,58.7C96,85,192,139,288,138.7C384,139,480,85,576,80C672,75,768,117,864,112C960,107,1056,53,1152,53.3C1248,53,1344,107,1392,133.3L1440,160L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z"></path>
        </svg>
        
        <div class="container text-center py-4">
            <h1 class="display-3 fw-bold mb-3"><%= blog.title %></h1>
            <div class="opacity-75 fs-5">
                Autor: <strong><%= blog.author %></strong> | Data: <%= blog.createdAt %>
            </div>
            <p class="lead mt-4 mx-auto" style="max-width: 800px; font-style: italic;">
                <%= blog.description %>
            </p>
        </div>
    </div>

    <div class="bg-white shadow-sm py-5" style="min-height: 60vh;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9 col-xl-8">
                    <article class="blog-body ck-content fs-5">
                        <%- blog.content %>
                    </article>
                </div>
            </div>
        </div>
    </div>

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" style="margin-top: -1px;">
        <path fill="#000000" fill-opacity="1" d="M0,32L48,58.7C96,85,192,139,288,138.7C384,139,480,85,576,80C672,75,768,117,864,112C960,107,1056,53,1152,53.3C1248,53,1344,107,1392,133.3L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>

    <%- include('../partials/footer.html', { }); %>
    
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/jquery/jquery-3.6.0.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
